<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#050506">
<title>WallaceAI</title>
<link rel="icon" href="/static/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside id="side" aria-label="Chats">
    <div class="brand"><img src="/static/logo-word.png" alt="WallaceAI"></div>
    <button class="newchat" id="newside" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      New chat
    </button>
    <nav id="list" aria-label="Chat history"></nav>
    <div class="sfoot">
      <a class="lnkrow" id="rbx" target="_blank" rel="noopener noreferrer" hidden>Follow on Roblox</a>
      <button class="lnkrow" id="acct" type="button">Sign in</button>
      <p class="note">History is saved on this device.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="col">
    <header class="topbar">
      <button class="icon" id="menu" type="button" aria-label="Open chat history">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <img class="tmark" src="/static/logo-mark.png" alt="WallaceAI">
      <button class="icon" id="new" type="button" aria-label="New chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
      </button>
    </header>
    <main id="main"><div class="wrap" id="log" aria-live="polite"></div></main>
    <form class="in" id="form">
      <div class="composer">
        <textarea id="box" rows="1" placeholder="Message WallaceAI" aria-label="Message"></textarea>
        <button class="icon" id="imgbtn" type="button" title="Create an image from your message" aria-label="Create an image" hidden>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.3"/><path d="M3.5 14l4-3.5 3 2.5 2.5-2 3.5 3"/></svg>
        </button>
        <button class="send" id="send" type="submit" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14V4M4.5 8.5L9 4l4.5 4.5"/></svg>
        </button>
      </div>
      <div class="foot"><span id="count"></span><span>WallaceAI can make mistakes. Chats are stored and may be reviewed by the site owner.</span></div>
    </form>
  </div>
</div>

<div class="overlay" id="limit" hidden role="dialog" aria-modal="true" aria-labelledby="ltitle">
  <div class="card">
    <h2 id="ltitle">Out of messages</h2>
    <p class="sub" id="lmsg"></p>
    <div id="bonus" hidden>
      <p class="sub">Follow me on Roblox to get 10 more messages.</p>
      <a class="send btn" id="rlink" target="_blank" rel="noopener noreferrer">Follow me on Roblox</a>
      <button class="ghost wide" id="claim" type="button">I followed, give me 10 more</button>
      <p class="err" id="cerr"></p>
    </div>
    <button class="ghost wide" id="lsign" type="button" hidden>Sign up with email instead</button>
    <button class="link" id="lclose" type="button">Not now</button>
  </div>
</div>
<div class="overlay" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="card">
    <h2 id="mtitle"></h2>
    <p class="sub" id="mmsg"></p>
    <form id="mform">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required>
      <p class="err" id="merr"></p>
      <button class="send" id="msubmit" type="submit"></button>
    </form>
    <button class="link" id="mswitch" type="button"></button>
    <button class="link" id="mclose" type="button" style="color:var(--muted)">Not now</button>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
