<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WallaceAI</title>
<link rel="icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <img src="/static/logo.png" alt="WallaceAI">
  <div class="hr"><button class="ghost" id="menu" type="button">☰ History</button>&nbsp;<span class="count" id="count"></span><button class="ghost" id="new">New chat</button>&nbsp;<button class="ghost" id="acct">Sign in</button></div>
</header>
<div class="app"><aside id="side"><button class="ghost newside" id="newside" type="button">+ New chat</button><div id="list"></div><p class="note">Chats are saved on this device only.</p></aside><div class="col"><main id="main"><div class="wrap" id="log"></div></main>
<form class="in" id="form">
  <div class="row">
    <textarea id="box" rows="1" placeholder="Ask WallaceAI about Lua, Python, or anything else…" autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
  <p class="note">WallaceAI can make mistakes. Check important code before you ship it.</p>
</form>
</div></div>
<div class="overlay" id="modal" hidden>
  <div class="card">
    <h2 id="mtitle"></h2>
    <p class="sub" id="mmsg"></p>
    <form id="mform">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required>
      <p class="err" id="merr"></p>
      <button class="send" id="msubmit" type="submit"></button>
    </form>
    <button class="link" id="mswitch" type="button"></button>
    <button class="link" id="mclose" type="button" style="color:var(--mute)">Not now</button>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
